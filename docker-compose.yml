services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: argus-backend
    container_name: argus-backend
    restart: unless-stopped
    # Solo localhost: il backend non ha bisogno di essere raggiungibile dalla rete.
    # Non ci sono chiavi API da configurare qui: si inseriscono da Settings.
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - argus-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    image: argus-frontend
    container_name: argus-frontend
    restart: unless-stopped
    # Solo localhost: l'interfaccia è pensata per un uso personale.
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - backend
    networks:
      - argus-net

networks:
  argus-net:
    driver: bridge
