# Argus: web interface (nginx) + backend (FastAPI) + sign-in (Authelia).
#
# Once, before the first start:   ./scripts/init.sh
# Then:                           docker compose up -d --build
# First user:                     docker compose exec backend python -m app.cli add-user <name>
#
# Data lives in ./data (not in git): data/argus/argus.db is Argus's SQLite database and
# data/authelia/ is Authelia's. To move Argus, copy .env, certs/ and data/.
#
# Everything goes through nginx's HTTPS port. The backend and Authelia are not published
# on the host: they are only reachable through nginx, which checks every request with Authelia.

services:
  authelia:
    image: authelia/authelia:4.39
    container_name: argus-authelia
    restart: unless-stopped
    environment:
      # Enables the {{ env "..." }} templates in the configuration file
      X_AUTHELIA_CONFIG_FILTERS: template
      ARGUS_DOMAIN: ${ARGUS_DOMAIN:-argus.localhost}
      ARGUS_PORT_SUFFIX: ${ARGUS_PORT_SUFFIX:-}
      ARGUS_AUTH_POLICY: ${ARGUS_AUTH_POLICY:-one_factor}
      AUTHELIA_SESSION_SECRET: ${AUTHELIA_SESSION_SECRET:?Run ./scripts/init.sh to create the .env file}
      AUTHELIA_STORAGE_ENCRYPTION_KEY: ${AUTHELIA_STORAGE_ENCRYPTION_KEY:?Run ./scripts/init.sh to create the .env file}
      AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET: ${AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET:?Run ./scripts/init.sh to create the .env file}
    volumes:
      - ./authelia/configuration.yml:/config/configuration.yml:ro
      # Users file: generated by the backend from its database, only read here
      - authelia-users:/users:ro
      # Authelia's database (second-factor devices, sessions) and verification codes
      - ./data/authelia:/data
    # Starts after the backend, which creates the users file at startup:
    # without that file Authelia stops ("healthy" means the file already exists).
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1 rather than "localhost": Authelia listens on IPv4 only, and "localhost" may resolve to ::1
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9091/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    networks:
      - argus-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: argus-backend
    container_name: argus-backend
    restart: unless-stopped
    # Same user as the owner of ./data, so the host can read and copy the database file.
    # On Linux init.sh sets it (ARGUS_UID/ARGUS_GID); on Docker Desktop the default works.
    user: "${ARGUS_UID:-1000}:${ARGUS_GID:-1000}"
    environment:
      # Encrypts the API keys stored in the database. If it is lost, the saved keys
      # cannot be recovered (see the README, "Backup").
      ARGUS_SECRET_KEY: ${ARGUS_SECRET_KEY:?Run ./scripts/init.sh to create the .env file}
      # Secret shared with nginx: the backend only accepts requests that carry it
      ARGUS_PROXY_SECRET: ${ARGUS_PROXY_SECRET:?Run ./scripts/init.sh to create the .env file}
      # Public addresses, for the "Sign out" link in Settings
      ARGUS_AUTH_URL: https://auth.${ARGUS_DOMAIN:-argus.localhost}${ARGUS_PORT_SUFFIX:-}
      ARGUS_PUBLIC_URL: https://${ARGUS_DOMAIN:-argus.localhost}${ARGUS_PORT_SUFFIX:-}
      # Same access policy as Authelia: with two_factor the second factor is mandatory
      # and Settings does not allow turning it off
      ARGUS_AUTH_POLICY: ${ARGUS_AUTH_POLICY:-one_factor}
    volumes:
      # SQLite database (users, password hashes, encrypted API keys, search preferences)
      - ./data/argus:/data
      # Users file for Authelia: regenerated from the database at startup and on every change
      - authelia-users:/authelia-users
    networks:
      - argus-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    image: argus-frontend
    container_name: argus-frontend
    restart: unless-stopped
    environment:
      ARGUS_DOMAIN: ${ARGUS_DOMAIN:-argus.localhost}
      ARGUS_PROXY_SECRET: ${ARGUS_PROXY_SECRET:?Run ./scripts/init.sh to create the .env file}
    ports:
      # Default: this computer only, port 443. To reach it from the network set
      # ARGUS_BIND=0.0.0.0 in .env (needs a real domain and a valid certificate).
      - "${ARGUS_BIND:-127.0.0.1}:${ARGUS_HTTPS_PORT:-443}:443"
    volumes:
      # TLS certificate (fullchain.pem, privkey.pem): created by scripts/init.sh
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_healthy
      authelia:
        condition: service_healthy
    networks:
      - argus-net

volumes:
  # Only the users file generated for Authelia: nothing in it needs to be kept
  authelia-users:

networks:
  argus-net:
    driver: bridge
