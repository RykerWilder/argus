services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: argus-backend
    container_name: argus-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    networks:
      - argus-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    image: argus-frontend
    container_name: argus-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - argus-net

networks:
  argus-net:
    driver: bridge
