# Include in the locations that serve Argus's pages and files: if the session is not valid
# Authelia answers 401 with the portal address (Location header) and nginx redirects the
# browser there. After sign-in the browser returns to the requested page.
auth_request /internal/authelia/authz;
auth_request_set $redirection_url $upstream_http_location;
error_page 401 =302 $redirection_url;
