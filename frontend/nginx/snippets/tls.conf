# Certificate and key: files in ./certs, mounted at /etc/nginx/certs. scripts/init.sh creates
# one for local use; for a real domain replace the two files (see the README).
ssl_certificate     /etc/nginx/certs/fullchain.pem;
ssl_certificate_key /etc/nginx/certs/privkey.pem;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_session_cache shared:argus_tls:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;
