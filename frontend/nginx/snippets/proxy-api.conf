# Every /api request goes through Authelia first. If the session is valid, nginx forwards
# it to the FastAPI backend with two headers the backend trusts (auth.py): Remote-User,
# with the authenticated user's name, and X-Argus-Proxy-Secret.
# proxy_set_header replaces any value the browser sent with the same name.
# proxy_pass without a URI keeps the request path (/api/...), so this works for any
# location under /api/.
auth_request /internal/authelia/authz;
auth_request_set $user $upstream_http_remote_user;
auth_request_set $name $upstream_http_remote_name;
auth_request_set $email $upstream_http_remote_email;
error_page 401 = @api_login_required;

proxy_pass http://backend:8000;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Remote-User $user;
proxy_set_header Remote-Name $name;
proxy_set_header Remote-Email $email;
proxy_set_header Remote-Groups "";
proxy_set_header X-Argus-Proxy-Secret $argus_proxy_secret;
proxy_read_timeout 60s;
