# Internal endpoint (unreachable from outside) nginx uses to query Authelia.
# Include it in the server; protected locations use it through auth_request.
location /internal/authelia/authz {
    internal;
    proxy_pass http://authelia:9091/api/authz/auth-request;

    # The X-* headers are required: Authelia derives the requested address from them.
    # $http_host (not $host) keeps the port when the site is not on 443.
    proxy_set_header X-Original-Method $request_method;
    proxy_set_header X-Original-URL $scheme://$http_host$request_uri;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Content-Length "";
    proxy_set_header Connection "";

    proxy_pass_request_body off;
    proxy_http_version 1.1;
    proxy_redirect http:// $scheme://;
    proxy_buffers 4 32k;
    client_body_buffer_size 128k;
}
