# Security headers, included in the server and in every location that defines other
# add_header directives (nginx does not inherit the outer add_header directives when a
# location has its own).
#
# CSP: everything from the same origin. The only exceptions are api.ipify.org ("Check my
# IP" button) and cdn.jsdelivr.net, which the frontend downloads the country borders from
# for the map if nginx does not serve /geo/countries-110m.json (see src/lib/geo/world.ts).
# style-src allows 'unsafe-inline' for the style attributes React generates; inline
# scripts stay forbidden.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://api.ipify.org https://cdn.jsdelivr.net; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
# Searched addresses appear in the URL (/ip/1.2.3.4): they must not go in the Referer
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# The site is served over HTTPS only: browsers must not even try HTTP (six months, this name only)
add_header Strict-Transport-Security "max-age=15552000" always;
