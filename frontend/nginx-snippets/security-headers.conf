# Header di sicurezza, inclusi nel server e in ogni location che definisce
# altri add_header (nginx non eredita gli add_header di livello superiore se
# la location ne ha di propri).
#
# CSP: tutto dalla stessa origine. L'unica eccezione è api.ipify.org, usata dal
# pulsante "Check my IP". style-src consente 'unsafe-inline' per gli attributi
# style generati da React; gli script inline restano vietati.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://api.ipify.org; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
# Gli indirizzi cercati compaiono nell'URL (/ip/1.2.3.4): non vanno nel Referer
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
