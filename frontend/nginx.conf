server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/snippets/security-headers.conf;

    # Reverse proxy verso il backend FastAPI
    location /api/ {
        include /etc/nginx/snippets/proxy-api.conf;
    }

    # Email header analyzer: file .eml / .msg fino a 25 MB (in base64 ~34 MB).
    # Il corpo della richiesta non viene salvato né scritto nei log.
    location /api/email/ {
        client_max_body_size 40m;
        client_body_buffer_size 40m;
        proxy_request_buffering on;
        include /etc/nginx/snippets/proxy-api.conf;
    }

    # File con hash nel nome: non cambiano mai, cache di un anno
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    location /geo/ {
        expires 30d;
        add_header Cache-Control "public";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # index.html non va in cache: dopo un aggiornamento deve puntare ai nuovi
    # file in /assets/, altrimenti il browser cerca pagine (chunk) che non esistono più.
    location = /index.html {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Fallback SPA per React Router (/ip/:ip)
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
